services:
  rabbitmq:
    image: rabbitmq:latest
    environment:
      - RABBITMQ_DEFAULT_USER=myuser
      - RABBITMQ_DEFAULT_PASS=secret
    ports:
      - "45672:5672"

  redis:
    image: redis:latest
    ports:
      - "46379:6379"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: wechat
    ports:
      - "45432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  whisper-api:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper-api
    restart: unless-stopped
    ports:
      - "48000:8000"
    environment:
      - WHISPER_MODEL=large-v3  # 可选: tiny, base, small, medium, large-v3
    volumes:
      - whisper_models:/root/.cache/huggingface # 挂载模型目录，避免每次重启重复下载

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wechat-frontend
    ports:
      - "3001:80" # Maps port 3001 on your host to Nginx port 80
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

volumes:
  pgdata:
  whisper_models: