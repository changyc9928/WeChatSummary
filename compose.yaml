services:
  rabbitmq:
    image: rabbitmq:latest
    environment:
      - RABBITMQ_DEFAULT_USER=myuser
      - RABBITMQ_DEFAULT_PASS=secret
    ports:
      - "45672:5672"

  redis:
    image: redis:latest
    ports:
      - "46379:6379"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: wechat
    ports:
      - "45432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  whisper-api:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper-api
    restart: unless-stopped
    ports:
      - "48000:8000"
    environment:
      - WHISPER_MODEL=large-v3  # 可选: tiny, base, small, medium, large-v3
    volumes:
      - whisper_models:/root/.cache/huggingface # 挂载模型目录，避免每次重启重复下载

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wechat-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: myuser
      SPRING_RABBITMQ_PASSWORD: secret
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wechat
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_AI_OPENAI_AUDIO_TRANSCRIPTION_BASE_URL: http://whisper-api:8000/v1/
      STORAGE_UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
      - ./tools:/app/tools
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - whisper-api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wechat-frontend
    ports:
      - "3001:80" # Maps port 3001 on your host to Nginx port 80
    depends_on:
      - postgres
      - rabbitmq
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  whisper_models: