# SPA nginx config for the WeChatSummary frontend.
# The bundle filenames are content-hashed, so assets can be cached forever;
# index.html must always revalidate so a browser that cached an old page (and
# with it an old bundle URL, e.g. before the bridge-log panel existed) picks
# up the new build after a normal refresh — no hard refresh needed.

# Plain HTTP only redirects to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API is same-origin over HTTPS, so chat content never
    # travels in plaintext.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100m;
        proxy_read_timeout 600s;
    }

    # HTML must revalidate on every load.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff;
    }

    # Hashed assets: safe to cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Everything else falls back to the SPA shell.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
