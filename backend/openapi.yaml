openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: tool-controller
  description: Distributable local tools (bridge.exe)
paths:
  /api/summary/{uuid}:
    post:
      tags:
      - chat-summary-controller
      operationId: startSummary
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryRequestDTO"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTaskAckResponse"
  /api/summary/restart/{uuid}:
