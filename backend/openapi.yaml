components:
  schemas:
    AiSettingsView:
      type: object
      description: Effective AI settings; secrets are masked, null means no key is configured
      properties:
        chatApiKey:
          type: string
          nullable: true
        chatBaseUrl:
          type: string
        chatModel:
          type: string
        imageApiKey:
          type: string
          nullable: true
        imageBaseUrl:
          type: string
        imageModel:
          type: string
        videoApiKey:
          type: string
          nullable: true
        videoBaseUrl:
          type: string
        videoModel:
          type: string
        transcriptionApiKey:
          type: string
          nullable: true
        transcriptionBaseUrl:
          type: string
        transcriptionModel:
          type: string
