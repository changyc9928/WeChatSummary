openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/summary/{uuid}:
    post:
      tags:
      - chat-summary-controller
      operationId: startSummary
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryRequestDTO"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTaskAckResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/summary/restart/{uuid}:
    post:
      tags:
      - chat-summary-controller
      operationId: restartSummary
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryRequestDTO"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTaskAckResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/summary/pause/{uuid}:
    post:
      tags:
      - chat-summary-controller
      operationId: pauseSummary
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTaskAckResponse"
  /api/preprocess/{uuid}:
    post:
      tags:
      - preprocess-controller
      operationId: preprocess
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTaskAckResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/preprocess/{uuid}/abort:
    post:
      tags:
      - preprocess-controller
      operationId: abortTask
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTaskAckResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/files/upload:
    post:
      tags:
      - upload-controller
      operationId: upload
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        description: ZIP archive to ingest
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUploadSessionResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/summary/status-pool/{uuid}:
    get:
      tags:
      - chat-summary-controller
      operationId: getStatusAndProgress
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSummaryProgressResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/summary/preview/{uuid}:
    get:
      tags:
      - chat-summary-controller
      operationId: getChatPreview
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseChatPreviewResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/preprocess/{uuid}/progress:
    get:
      tags:
      - preprocess-controller
      operationId: getProgress
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTaskProgress"
  /api/preprocess/images/{id}/file:
    get:
      tags:
      - preprocess-controller
      operationId: getImageFileById
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
                format: binary
        "404":
          description: Not Found
  /api/preprocess/images/summaries:
    get:
      tags:
      - preprocess-controller
      operationId: getImageSummariesByUuid
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePageImageSummaryEntity"
    delete:
      tags:
      - preprocess-controller
      operationId: deleteImageSummariesByIds
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/preprocess/audios/{id}/file:
    get:
      tags:
      - preprocess-controller
      operationId: getAudioFileById
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
                format: binary
        "404":
          description: Not Found
  /api/preprocess/audios/summaries:
    get:
      tags:
      - preprocess-controller
      operationId: getAudioSummariesByUuid
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePageAudioSummary"
    delete:
      tags:
      - preprocess-controller
      operationId: deleteAudioSummariesByIds
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/files/sessions:
    get:
      tags:
      - upload-controller
      operationId: getAvailableSessions
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListSessionResponseDTO"
  /api/preprocess/images/summaries/{id}:
    delete:
      tags:
      - preprocess-controller
      operationId: deleteImageSummaryById
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/preprocess/images/summaries/all:
    delete:
      tags:
      - preprocess-controller
      operationId: deleteAllImageSummariesByUuid
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/preprocess/audios/summaries/{id}:
    delete:
      tags:
      - preprocess-controller
      operationId: deleteAudioSummaryById
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/preprocess/audios/summaries/{id}/text:
    delete:
      tags:
      - preprocess-controller
      operationId: clearAudioSummaryTextById
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/preprocess/audios/summaries/text:
    delete:
      tags:
      - preprocess-controller
      operationId: clearAudioSummaryTextsByIds
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/preprocess/audios/summaries/all:
    delete:
      tags:
      - preprocess-controller
      operationId: deleteAllAudioSummariesByUuid
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: uuid
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
components:
  schemas:
    ErrorResponse:
      type: object
      description: Unified error body. The code mirrors the HTTP status.
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          nullable: true
    ApiResponseAuthResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/AuthResponse"
    ApiResponseChatPreviewResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/ChatPreviewResponse"
    ApiResponseListSessionResponseDTO:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/SessionResponseDTO"
    ApiResponsePageAudioSummary:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/PageAudioSummary"
    ApiResponsePageImageSummaryEntity:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/PageImageSummaryEntity"
    ApiResponseSummaryProgressResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/SummaryProgressResponse"
    ApiResponseTaskAckResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/TaskAckResponse"
    ApiResponseTaskProgress:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/TaskProgress"
    ApiResponseUploadSessionResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/UploadSessionResponse"
    ApiResponseVoid:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          nullable: true
    SummaryRequestDTO:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    AuthRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        uuid:
          type: string
    ChatPreviewResponse:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties:
            type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ChatPreviewRow"
    ChatPreviewRow:
      type: object
      properties:
        lineId:
          type: string
        timestamp:
          type: string
        sender:
          type: string
        content:
          type: string
    SummaryProgressResponse:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - INITIAL_STATE
          - RUNNING
          - PAUSED
          - SUCCESS
          - FAILED
        progress:
          type: number
          format: double
        result:
          type: string
        errorMessage:
          type: string
    TaskAckResponse:
      type: object
      properties:
        taskId:
          type: string
        status:
          type: string
          nullable: true
          enum:
          - INITIAL_STATE
          - RUNNING
          - PAUSED
          - SUCCESS
          - FAILED
        message:
          type: string
    UploadSessionResponse:
      type: object
      properties:
        sessionId:
          type: string
    TaskProgress:
      type: object
      properties:
        status:
          type: string
          enum:
          - IDLING
          - RUNNING
          - PAUSED
          - COMPLETED
        totalTasks:
          type: integer
          format: int32
        remainingTasks:
          type: integer
          format: int32
        completedTasks:
          type: integer
          format: int32
        progressPercentage:
          type: number
          format: double
    ImageSummaryEntity:
      type: object
      properties:
        id:
          type: string
        imageHash:
          type: string
        filePath:
          type: string
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
    PageImageSummaryEntity:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/ImageSummaryEntity"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        unpaged:
          type: boolean
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
    SortObject:
      type: object
      properties:
        sorted:
          type: boolean
        empty:
          type: boolean
        unsorted:
          type: boolean
    AudioSummary:
      type: object
      properties:
        id:
          type: string
        fileHash:
          type: string
        filePath:
          type: string
        transcript:
          type: string
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
    PageAudioSummary:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/AudioSummary"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    SessionResponseDTO:
      type: object
      properties:
        uuid:
          type: string
        jsonFilename:
          type: string
        uploadedAt:
          type: string
