components:
  schemas:
    SummaryRequestDTO:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    ApiResponseTaskAckResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/TaskAckResponse"
    TaskAckResponse:
      type: object
      properties:
        taskId:
          type: string
        status:
          type: string
          enum:
          - INITIAL_STATE
          - RUNNING
          - PAUSED
          - SUCCESS
          - FAILED
        message:
          type: string
    ApiResponseUploadSessionResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/UploadSessionResponse"
    UploadSessionResponse:
      type: object
      properties:
        sessionId:
          type: string
    AuthRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    ApiResponseAuthResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/AuthResponse"
    AuthResponse:
      type: object
      properties:
        uuid:
          type: string
    ApiResponseBridgeToolMeta:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/BridgeToolMeta"
    BridgeToolMeta:
      type: object
      properties:
        present:
          type: boolean
        fileName:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
        downloadUrl:
          type: string
        help:
          type: string
    ApiResponseSummaryProgressResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/SummaryProgressResponse"
    SummaryProgressResponse:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - INITIAL_STATE
          - RUNNING
          - PAUSED
          - SUCCESS
          - FAILED
        progress:
          type: number
          format: double
        result:
          type: string
        errorMessage:
          type: string
    ApiResponseChatPreviewResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/ChatPreviewResponse"
    ChatPreviewResponse:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties:
            type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ChatPreviewRow"
    ChatPreviewRow:
      type: object
      properties:
        lineId:
          type: string
        timestamp:
          type: string
        sender:
          type: string
        content:
          type: string
    ApiResponseTaskProgress:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/TaskProgress"
    TaskProgress:
      type: object
      properties:
        status:
          type: string
          enum:
          - IDLING
          - RUNNING
          - PAUSED
          - COMPLETED
        totalTasks:
          type: integer
          format: int32
        remainingTasks:
          type: integer
          format: int32
        completedTasks:
          type: integer
          format: int32
        progressPercentage:
          type: number
          format: double
    ApiResponsePageVideoSummary:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/PageVideoSummary"
    PageVideoSummary:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/VideoSummary"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        sort:
          $ref: "#/components/schemas/SortObject"
        offset:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        unpaged:
          type: boolean
        paged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        unsorted:
          type: boolean
        sorted:
          type: boolean
    VideoSummary:
      type: object
      properties:
        id:
          type: string
        fileHash:
          type: string
        filePath:
          type: string
        transcript:
          type: string
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
    ApiResponsePageImageSummaryEntity:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/PageImageSummaryEntity"
    ImageSummaryEntity:
      type: object
      properties:
        id:
          type: string
        imageHash:
          type: string
        filePath:
          type: string
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
    PageImageSummaryEntity:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/ImageSummaryEntity"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    ApiResponsePageAudioSummary:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/PageAudioSummary"
    AudioSummary:
      type: object
      properties:
        id:
