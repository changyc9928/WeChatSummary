openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: bridge-log-controller
  description: Bridge log streaming (webhook ingest + viewer)
- name: settings-controller
  description: Server-wide AI provider settings (keys, endpoints, models)
- name: tool-controller
  description: Distributable local tools (bridge.exe)
paths:
  /api/tools/bridge/logs:
    get:
      tags:
      - bridge-log-controller
      summary: Return stored bridge log lines after the given cursor
      operationId: since
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLogsResponse"
    post:
      tags:
      - bridge-log-controller
      summary: Ingest log lines POSTed by the bridge webhook
      operationId: ingest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonNode"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseInteger"
    delete:
      tags:
      - bridge-log-controller
      summary: Clear the in-memory bridge log ring
      operationId: clear
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/summary/{uuid}:
    post:
      tags:
      - chat-summary-controller
      operationId: startSummary
      parameters:
      - name: X-User-Id
