spring:
  application:
    name: WeChatSummary

  servlet:
    multipart:
      max-file-size: 20GB
      max-request-size: 20GB

  data:
    redis:
      host: localhost
      port: 46379

  rabbitmq:
    host: localhost
    port: 45672
    username: myuser
    password: secret

  datasource:
    url: jdbc:postgresql://localhost:45432/wechat
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      chat:
        temperature: 0.1
        timeout: 600s
        options:
          model: gemini-3.5-flash-lite
      audio:
        transcription:
          timeout: 300s
          base-url: http://localhost:48000/v1/
          options:
            model: large-v3

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

custom-ai:
  multimodal:
    base-url: https://integrate.api.nvidia.com/v1
    api-key: ${NVIDIA_API_KEY}
    model: meta/llama-3.2-11b-vision-instruct
    timeout: 120s
  video:
    base-url: https://integrate.api.nvidia.com/v1
    api-key: ${NVIDIA_API_KEY}
    model: meta/llama-3.2-11b-vision-instruct
    timeout: 120s
    frame-count: 5

storage:
  upload-dir: ./uploads
  tools-dir: ./tools

processing:
  image-max-size-bytes: 5000000
  log-progress-every: 500

summary:
  chunk-size-chars: 15000
  combine-batch: 2
  progress-cap: 99.9

task:
  redis-ttl: 1d

http:
  cache-max-age: 1h

rabbit:
  concurrent-consumers: 3
  max-concurrent-consumers: 10
  prefetch-count: 5

cache:
  ttl-default: 1d
  ttl-audio: 7d
  ttl-image: 3d
